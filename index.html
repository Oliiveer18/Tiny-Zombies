<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tiny Zombies</title>
<style>
html,body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;margin:0;height:100%;background:#05080f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;color:#cfe}
canvas{display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,10,.75) 100%)}
#hud{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
.bar{width:150px;height:8px;background:#0008;margin:4px 0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:100%}
#hp i{background:#e44}#st i{background:#4ce}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000a;font-size:20px;white-space:pre-line}
#msg.hide{display:none}
.stick{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#fff1;border:2px solid #fff3;display:none}
.stick b{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff5}
#sl{left:24px}#sr{right:24px}
.btn{position:fixed;display:none;width:62px;height:62px;border-radius:50%;background:#fff2;border:2px solid #fff4;align-items:center;justify-content:center;font-size:12px}
#bu{right:190px;bottom:max(190px,env(safe-area-inset-bottom));background:#fff3;border-color:#fff;font-size:11px;font-weight:bold}body.touch #bu{display:none}body.touch #bu.on{display:flex}#ul{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);display:none;padding:6px 14px;border-radius:14px;background:#0008;color:#fff;font:15px sans-serif;pointer-events:none;z-index:5}#ul.on{display:block}
#bg{right:170px;bottom:max(40px,env(safe-area-inset-bottom))}#br{right:190px;bottom:max(115px,env(safe-area-inset-bottom))}
#brun{left:28px;bottom:max(190px,env(safe-area-inset-bottom))}.btn.on{background:#fff6;border-color:#fff}
.stick{opacity:.55}body.touch .stick{display:block}body.touch .btn{display:flex}
#gear{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;background:#0008;border:1px solid #fff4;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.7;z-index:20}
#cfgm{position:fixed;inset:0;margin:auto;width:min(560px,94vw);height:fit-content;max-height:92vh;overflow:auto;flex-direction:column;gap:6px;padding:10px 14px;background:#0b1220f2;border:1px solid #fff3;border-radius:14px;z-index:30;display:none;touch-action:manipulation;font-size:14px}
#cfgm h3{margin:0;font-size:18px}#cfgm .s{font-size:12px;opacity:.7}#cfgm .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
#cfgm button{min-width:80px;padding:6px 8px;border-radius:8px;border:1px solid #fff4;background:#fff2;color:#cfe;font-size:14px}#cfgm input[type=range]{width:50%;touch-action:pan-x}
#cfgm .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}#cfgm .c span{font-size:13px}#cfgm .c button{min-width:70px}
#ver{position:fixed;left:max(6px,env(safe-area-inset-left));bottom:max(4px,env(safe-area-inset-bottom));font-size:9px;opacity:.45;pointer-events:none;z-index:5;letter-spacing:.3px}
body.pad .stick,body.pad .btn{display:none!important}
</style></head><body>
<div id="vig"></div>
<div id="hud"><div id="hp" class="bar"><i></i></div><div id="st" class="bar"><i></i></div><div id="info"></div></div>
<div id="sl" class="stick"><b></b></div><div id="sr" class="stick"><b></b></div>
<div id="bg" class="btn">GRAN.</div><div id="br" class="btn">RECAR.</div><div id="bu" class="btn"></div><div id="ul"></div>
<div id="msg"></div><div id="ver"></div>
<script type="module" src="/src/main.js"></script></body></html>
